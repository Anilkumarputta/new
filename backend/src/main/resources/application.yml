spring:
  application:
    name: editorial-content-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/editorial_platform
    username: editorial_user
    password: editorial_password
  cassandra:
    contact-points: localhost
    port: 9042
    keyspace-name: editorial_read_model
    local-datacenter: datacenter1
    schema-action: create_if_not_exists
solr:
  base-url: http://localhost:8983/solr
  core: editorial_content
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: editorial-content-platform
      auto-offset-reset: earliest
      properties:
        spring:
          json:
            trusted:
              packages: "com.editorial.platform.event"
    producer:
      properties:
        spring:
          json:
            add:
              type:
                headers: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
